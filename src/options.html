<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Context Vocab — 设置</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-2: #232347;
      --border: #2a2a44;
      --text: #e0e0e0;
      --muted: #9a9ab0;
      --accent: #7c83fd;
      --good: #3da66f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .wrap { max-width: 540px; width: 100%; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p.lede { color: var(--muted); margin: 0 0 28px; }
    .field { display: block; margin-bottom: 20px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .field input {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    .field a { color: var(--accent); text-decoration: none; }
    .field a:hover { text-decoration: underline; }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    button.primary {
      background: var(--accent);
      color: #0e0e22;
      border: none;
      border-radius: 6px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover { filter: brightness(1.07); }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .ok { color: var(--good); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Context Vocab — 设置</h1>
    <p class="lede">Key 仅保存在你本地浏览器，不会上传到任何服务器。</p>

    <div class="field">
      <label for="deepseek_key">DeepSeek API Key</label>
      <input id="deepseek_key" type="password" autocomplete="off" placeholder="sk-...">
      <div class="hint">用于结合上下文给出中文释义。注册地址：<a href="https://platform.deepseek.com/" target="_blank" rel="noopener">platform.deepseek.com</a>。一次查询大约 ¥0.003。</div>
    </div>

    <div class="field">
      <label for="eudic_token">欧陆词典 OpenAPI Token</label>
      <input id="eudic_token" type="password" autocomplete="off" placeholder="原始 token，不要带 Bearer 前缀">
      <div class="hint">用于把单词和语境笔记写入欧陆生词本。Token 获取地址：<a href="https://my.eudic.net/OpenAPI/Authorization" target="_blank" rel="noopener">my.eudic.net/OpenAPI/Authorization</a>。<br>注意：粘贴**原始 token**，不要带 Bearer 或其他前缀。</div>
    </div>

    <div class="row">
      <button id="save" class="primary" type="button">保存</button>
      <button id="clear" class="ghost" type="button">清除全部</button>
      <span id="status" class="ok" hidden>已保存。</span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
