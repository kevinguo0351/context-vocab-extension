<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Context Vocab — Settings</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-2: #232347;
      --border: #2a2a44;
      --text: #e0e0e0;
      --muted: #9a9ab0;
      --accent: #7c83fd;
      --good: #3da66f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .wrap {
      max-width: 540px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    p.lede {
      color: var(--muted);
      margin: 0 0 28px;
    }
    .field {
      display: block;
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .field input {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .field a {
      color: var(--accent);
      text-decoration: none;
    }
    .field a:hover { text-decoration: underline; }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }
    button.primary {
      background: var(--accent);
      color: #0e0e22;
      border: none;
      border-radius: 6px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover { filter: brightness(1.07); }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .ok {
      color: var(--good);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Context Vocab — Settings</h1>
    <p class="lede">Keys are stored locally in your browser only.</p>

    <div class="field">
      <label for="deepseek_key">DeepSeek API Key</label>
      <input id="deepseek_key" type="password" autocomplete="off" placeholder="sk-...">
      <div class="hint">Used for context-aware word explanations. Get one at <a href="https://platform.deepseek.com/" target="_blank" rel="noopener">platform.deepseek.com</a>.</div>
    </div>

    <div class="field">
      <label for="eudic_token">Eudic Bearer Token</label>
      <input id="eudic_token" type="password" autocomplete="off" placeholder="Bearer token from Eudic">
      <div class="hint">Used to save words into your Eudic study list. Get yours at <a href="https://my.eudic.net/OpenAPI/Authorization" target="_blank" rel="noopener">my.eudic.net/OpenAPI/Authorization</a>.</div>
    </div>

    <div class="row">
      <button id="save" class="primary" type="button">Save</button>
      <button id="clear" class="ghost" type="button">Clear all</button>
      <span id="status" class="ok" hidden>Saved.</span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
